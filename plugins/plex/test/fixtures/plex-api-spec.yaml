        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: tonight
          description:
            Indicate that you want the update to run during the next Butler execution. Omitting this or setting it
            to false indicates that the update should install immediately.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: skip
          description:
            Indicate that the latest version should be marked as skipped. The <Release> entry for this version will
            have the `state` set to `skipped`.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
      responses:
        '200':
          description: The update process started correctly
        '400':
          description: This system cannot install updates
        '500':
          description: The update process failed to start
