# Reduced copy of LukeHagar/plex-api-spec plex-api-spec.yaml at a632c48 (Apache-2.0): responses cut to
# descriptions, unreferenced components dropped, example values and hex identifiers replaced with EXAMPLE.
openapi: 3.1.1
info:
  title: Plex Media Server
  version: 1.1.1
  description: 'OpenAPI specification for the Plex Media Server (PMS) API and the plex.tv cloud API.


    ## Base URLs


    - **PMS (local server)**: `http(s)://{host}:{port}` — Most endpoints in this spec target the local PMS.

    - **plex.tv v2**: `https://plex.tv/api/v2` — Authentication, account, and social endpoints.

    - **plex.tv v1 (legacy)**: `https://plex.tv/api` — Legacy XML endpoints (friends, home users, claims).

    - **Cloud providers**: `https://discover.provider.plex.tv`, `https://metadata.provider.plex.tv`, etc.


    Endpoints that target plex.tv or cloud providers declare an override `servers` array.


    ## Authentication


    - **X-Plex-Token**: Pass via the `X-Plex-Token` header on every request. It may also be passed as a query parameter (`?X-Plex-Token=...`)
    on all endpoints.

    - **X-Plex-Client-Identifier**: Mandatory for OAuth PIN flow (`/pins`) and JWT device registration. Must be a unique,
    persistent identifier for the client application.

    - **OAuth PIN Flow**: `POST /pins` → user visits `https://plex.tv/link` → `GET /pins/{pinId}` → obtain `authToken`.


    ## Response Formats


    - **PMS endpoints**: Return XML by default. Send `Accept: application/json` to receive JSON.

    - **plex.tv v2**: Returns JSON by default.

    - **Legacy v1 endpoints** (`/pins.xml`, `/api/resources`, `/api/users/`): Return XML only.


    ## Rate Limiting


    plex.tv auth endpoints (PIN creation, sign-in) enforce rate limits. Clients should implement exponential backoff and reuse
    tokens rather than re-authenticating on every request.'
  contact:
    name: Plex API Spec Maintainers
    url: https://github.com/LukasParke/plex-api-spec
    email: api@plex.tv
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://{IP-description}.{identifier}.plex.direct:{port}
    variables:
      identifier:
        description: The unique identifier of this particular PMS
        default: EXAMPLE
      IP-description:
        description: A `-` separated string of the IPv4 or IPv6 address components
        default: 1-2-3-4
      port:
        description: The Port number configured on the PMS. Typically (`32400`).
        default: '32400'
  - url: '{protocol}://{host}:{port}'
    variables:
      host:
        description: 'The Host of the PMS.

          If using on a local network, this is the internal IP address of the server hosting the PMS.

          If using on an external network, this is the external IP address for your network, and requires port forwarding.

          If using a reverse proxy, this would be the external DNS domain for your network, and requires the proxy handle port
          forwarding.'
        default: localhost
      port:
        description:
          "The Port number configured on the PMS. Typically (`32400`). \nIf using a reverse proxy, this would be\
          \ the port number configured on the proxy."
        default: '32400'
      protocol:
        description: The network protocol to use. Typically (`http` or `https`)
        default: http
  - url: '{full_server_url}'
    variables:
      full_server_url:
        description: The full manual URL to access the PMS
        default: http://localhost:32400
security:
  - token:
      - shared user
      - admin
tags:
  - name: Activities
    description:
      'Activities provide a way to monitor and control asynchronous operations on the server. In order to receive
      real-time updates for activities, a client would normally subscribe via either EventSource or Websocket endpoints.


      Activities are associated with HTTP replies via a special `X-Plex-Activity` header which contains the UUID of the activity.


      Activities are optional cancellable. If cancellable, they may be cancelled via the `DELETE` endpoint.'
  - name: Authentication
    description: Plex Authentication operations
  - name: Butler
    description:
      The butler is responsible for running periodic tasks.  Some tasks run daily, others every few days, and some
      weekly.  These includes database maintenance, metadata updating, thumbnail generation, media analysis, and other tasks.
  - name: Collections
    description: API Operations against the Collections
  - name: Content
    description: The actual content of the media provider
  - name: Devices
    description:
      "Media grabbers provide ways for media to be obtained for a given protocol. The simplest ones are `stream`\
      \ and `download`. More complex grabbers can have associated devices\n\nNetwork tuners can present themselves on the network\
      \ using the Simple Service Discovery Protocol and Plex Media Server will discover them. The following XML is an example\
      \ of the data returned from SSDP. The `deviceType`, `serviceType`, and `serviceId` values must remain as they are in the\
      \ example in order for PMS to properly discover the device. Other less-obvious fields are described in the parameters\
      \ section below.\n\nExample SSDP output\n```\n<root xmlns=\"urn:schemas-upnp-org:device-1-0\">\n    <specVersion>\n  \
      \      <major>1</major>\n        <minor>0</minor>\n    </specVersion>\n    <device>\n        <deviceType>urn:plex-tv:device:Media:1</deviceType>\n\
      \        <friendlyName>Turing Hopper 3000</friendlyName>\n        <manufacturer>Plex, Inc.</manufacturer>\n        <manufacturerURL>https://plex.tv/</manufacturerURL>\n\
      \        <modelDescription>Turing Hopper 3000 Media Grabber</modelDescription>\n        <modelName>Plex Media Grabber</modelName>\n\
      \        <modelNumber>1</modelNumber>\n        <modelURL>https://plex.tv</modelURL>\n        <UDN>uuid:42fde8e4-93b6-41e5-8a63-12d848655811</UDN>\n\
      \        <serviceList>\n            <service>\n                <URLBase>http://10.0.0.5:8088</URLBase>\n             \
      \   <serviceType>urn:plex-tv:service:MediaGrabber:1</serviceType>\n                <serviceId>urn:plex-tv:serviceId:MediaGrabber</serviceId>\n\
      \            </service>\n        </serviceList>\n    </device>\n</root>\n```\n\n  - UDN: (string) A UUID for the device.\
      \ This should be unique across models of a device at minimum.\n  - URLBase: (string) The base HTTP URL for the device\
      \ from which all of the other endpoints are hosted.\n\nNote: This tag covers media grabber and network tuner devices only.\
      \ For client device discovery, use `/clients` or `/resources`."
  - name: Download Queue
    description: 'API Operations against the Download Queue.

      Note: The Download Queue is distinct from the Play Queue. The Download Queue manages offline/downloaded content, while
      the Play Queue manages active playback sessions.'
  - name: DVRs
    description:
      The DVR provides means to watch and record live TV.  This section of endpoints describes how to setup the DVR
      itself
  - name: EPG
    description:
      The EPG (Electronic Program Guide) is responsible for obtaining metadata for what is airing on each channel
      and when
  - name: Events
    description:
      'The server can notify clients in real-time of a wide range of events, from library scanning, to preferences
      being modified, to changes to media, and many other things. This is also the mechanism by which activity progress is reported.


      Two protocols for receiving the events are available: EventSource (also known as SSE), and WebSocket.'
  - name: General
    description: General endpoints for basic PMS operation not specific to any media provider
  - name: Hubs
    description: The hubs within a media provider
  - name: Library
    description:
      Library endpoints which are outside of the Media Provider API.  Typically this is manipulation of the library
      (adding/removing sections, modifying preferences, etc).
  - name: Library Collections
    description:
      Endpoints for manipulating collections.  In addition to these endpoints, `/library/collections/:collectionId/X`
      will be rerouted to `/library/metadata/:collectionId/X` and respond to those endpoints as well.
    x-displayName: 'Library: Collections'
  - name: Library Playlists
    description: Endpoints for manipulating playlists.
    x-displayName: 'Library: Playlists'
  - name: Live TV
    description: LiveTV contains the playback sessions of a channel from a DVR device
  - name: Log
    description: Logging mechanism to allow clients to log to the server
  - name: Play Queue
    description:
      "The playqueue feature within a media provider\nA play queue represents the current list of media for playback.\
      \ Although queues are persisted by the server, they should be regarded by the user as a fairly lightweight, an ephemeral\
      \ list of items queued up for playback in a session.  There is generally one active queue for each type of media (music,\
      \ video, photos) that can be added to or destroyed and replaced with a fresh queue.\nPlay Queues has a region, which we\
      \ refer to in this doc (partially for historical reasons) as \"Up Next\". This region is defined by `playQueueLastAddedItemID`\
      \ existing on the media container. This follows iTunes' terminology. It is a special region after the currently playing\
      \ item but before the originally-played items. This enables \"Party Mode\" listening/viewing, where items can be added\
      \ on-the-fly, and normal queue playback resumed when completed. \nYou can visualize the play queue as a sliding window\
      \ in the complete list of media queued for playback. This model is important when scaling to larger play queues (e.g.\
      \ shuffling 40,000 audio tracks). The client only needs visibility into small areas of the queue at any given time, and\
      \ the server can optimize access in this fashion.\nAll created play queues will have an empty \"Up Next\" area - unless\
      \ the item is an album and no `key` is provided. In this case the \"Up Next\" area will be populated by the contents of\
      \ the album. This is to allow queueing of multiple albums - since the 'Add to Up Next' will insert after all the tracks.\
      \ This means that If you're creating a PQ from an album, you can only shuffle it if you set `key`. This is due to the\
      \ above implicit queueing of albums when no `key` is provided as well as the current limitation that you cannot shuffle\
      \ a PQ with an \"Up Next\" area.\nThe play queue window advances as the server receives timeline requests. The client\
      \ needs to retrieve the play queue as the “now playing” item changes. There is no play queue API to update the playing\
      \ item."
  - name: Playback
    description: Plex Playback operations
  - name: Playlist
    description: Media playlists that can be created and played back
  - name: Playlists
    description: Plex Playlists operations
  - name: Plex
    description: Plex Plex operations
  - name: Preferences
    description: API Operations against the Preferences
  - name: Provider
    description:
      'Media providers are the starting points for the entire Plex Media Server media library API.  It defines the
      paths for the groups of endpoints.  The `/media/providers` should be the only hard-coded path in clients when accessing
      the media library.  Non-media library endpoints are outside the scope of the media provider.  See the description in See
      [the section in API Info](#section/API-Info/Media-Providers) for more information on how to use media providers.

      Note: Dynamic proxy paths such as `/{provider}/search`, `/{provider}/metadata`, and other provider-relative routes are
      resolved through the media provider API.'
  - name: Rate
    description: Operations for rating media items (thumbs up/down, star ratings, etc.)
  - name: Search
    description: The search feature within a media provider
  - name: Status
    description: The status endpoints give you information about current playbacks, play history, and even terminating sessions.
  - name: Subscriptions
    description:
      Subscriptions determine which media will be recorded and the criteria for selecting an airing when multiple
      are available
  - name: Timeline
    description: The actions feature within a media provider
  - name: Transcoder
    description: API Operations against the Transcoder
  - name: UltraBlur
    description: Service provided to compute UltraBlur colors and images.
  - name: Updater
    description: 'This describes the API for searching and applying updates to the Plex Media Server.

      Updates to the status can be observed via the Event API.'
  - name: Users
    description: Plex Users operations
paths:
  /:
    get:
      operationId: getServerInfo
      summary: Get PMS info
      tags:
        - General
      description: Information about this PMS setup and configuration
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
  /:/eventsource/notifications:
    get:
      operationId: getNotifications
      summary: Connect to Eventsource
      tags:
        - Events
      description: Connect to the event source to get a stream of events
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: filter
          description:
            'By default, all events except logs are sent. A rich filtering mechanism is provided to allow clients
            to opt into or out of each event type using the `filters` parameter. For example:


            - `filters=-log`: All event types except logs (the default).

            - `filters=foo,bar`: Only the foo and bar event types.

            - `filters=`: All events types.

            - `filters=-foo,bar`: All event types except foo and bar.'
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
  /:/prefs:
    get:
      operationId: getAllPreferences
      summary: Get all preferences
      tags:
        - Preferences
      description: Get the list of all preferences
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
    put:
      operationId: setPreferences
      summary: Set preferences
      tags:
        - Preferences
      description: Set a set of preferences in query parameters
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: prefs
          description: The preference key to retrieve or set
          in: query
          required: true
          schema:
            type: object
          example:
            FriendlyName: EXAMPLE
            ScheduledLibraryUpdateInterval: 3600
            sendCrashReports: 1
      responses:
        '200':
          description: 'See #/components/responses/200'
        '400':
          description: Attempt to set a preferences that doesn't exist
        '403':
          description: Attempt to set a preferences that doesn't exist
  /:/prefs/get:
    get:
      operationId: getPreference
      summary: Get a preferences
      tags:
        - Preferences
      description: Get a single preference and value
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: id
          description: The preference to fetch
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: No preference with the provided name found.
  /:/progress:
    get:
      operationId: getProgress
      summary: Get Progress
      tags:
        - Playback
      description: Get or update watch progress for a media item.
      security:
        - token:
            - admin
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: key
          description: The metadata key of the item
          in: query
          required: true
          schema:
            type: string
        - name: time
          description: The current playback position in milliseconds
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
  /:/rate:
    put:
      operationId: setRating
      summary: Rate an item
      tags:
        - Rate
      description: 'Set the rating on an item.

        This API does respond to the GET verb but applications should use PUT'
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: identifier
          description: The identifier of the media provider containing the media to rate.  Typically `com.plexapp.plugins.library`
          in: query
          required: true
          schema:
            type: string
        - name: key
          description: The key of the item to rate.  This is the `ratingKey` found in metadata items
          in: query
          required: true
          schema:
            type: string
        - name: rating
          description: The rating to give the item.
          in: query
          required: true
          schema:
            type: number
            minimum: 0
            maximum: 10
        - name: ratedAt
          description: The time when the rating occurred.  If not present, interpreted as now.
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'See #/components/responses/200'
        '400':
          description:
            Bad Request.  Can occur when parameters are of the wrong type, missing, or if the `ratedAt` is in the
            future
        '404':
          description:
            Indicates that no library with the provide identifier can be found or no item can be found with the
            rating key
  /:/scrobble:
    put:
      operationId: markPlayed
      summary: Mark an item as played
      tags:
        - Timeline
      description:
        'Mark an item as played.  Note, this does not create any view history of this item but rather just sets
        the state as played. The client must provide either the `key` or `uri` query parameter

        This API does respond to the GET verb but applications should use PUT'
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: identifier
          description: The identifier of the media provider containing the media to rate.  Typically `com.plexapp.plugins.library`
          in: query
          required: true
          schema:
            type: string
        - name: key
          description: The key of the item to rate.  This is the `ratingKey` found in metadata items
          in: query
          required: false
          schema:
            type: string
        - name: uri
          description:
            URI of the item to scrobble. Format is `library://<section-uuid>/item/<url-encoded-key>` or `plex://movie/<guid>`
            or `plex://episode/<guid>`.
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'See #/components/responses/200'
        '400':
          description: Bad Request.  Can occur when parameters are of the wrong type, or missing
        '404':
          description:
            Indicates that no library with the provide identifier can be found or no item can be found with the
            rating key
  /:/timeline:
    post:
      operationId: report
      summary: Report media timeline
      tags:
        - Timeline
      description:
        This endpoint is hit during media playback for an item. It must be hit whenever the play state changes,
        or in the absence of a play state change, in a regular fashion (generally this means every 10 seconds on a LAN/WAN,
        and every 20 seconds over cellular).
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: key
          description: The details key for the item.
          in: query
          schema:
            type: string
          example: EXAMPLE
        - name: ratingKey
          description: The rating key attribute for the item.
          in: query
          schema:
            type: string
          example: EXAMPLE
        - name: state
          description: The current state of the media.
          in: query
          schema:
            type: string
            enum:
              - stopped
              - buffering
              - playing
              - paused
          example: EXAMPLE
        - name: playQueueItemID
          description: If playing media from a play queue, the play queue's ID.
          in: query
          schema:
            type: string
          example: EXAMPLE
        - name: time
          description: The current time offset of playback in ms.
          in: query
          schema:
            type: integer
          example: 0
        - name: duration
          description: The total duration of the item in ms.
          in: query
          schema:
            type: integer
          example: 10000
        - name: continuing
          description:
            When state is `stopped`, a flag indicating whether or not the client is going to continue playing anothe
            item.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
          example: 1
        - name: updated
          description:
            Used when a sync client comes online and is syncing media timelines, holds the time at which the playback
            state was last updated.
          in: query
          schema:
            type: integer
          example: 14200000
        - name: offline
          description:
            Also used by sync clients, used to indicate that a timeline is being synced from being offline, as opposed
            to being "live".
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
          example: 1
        - name: timeToFirstFrame
          description: Time in seconds till first frame is displayed.  Sent only on the first playing timeline request.
          in: query
          schema:
            type: integer
          example: 1000
        - name: timeStalled
          description: Time in seconds spent buffering since last request.
          in: query
          schema:
            type: integer
          example: 1000
        - name: bandwidth
          description: Bandwidth in kbps as estimated by the client.
          in: query
          schema:
            type: integer
          example: 100
        - name: bufferedTime
          description: Amount of time in seconds buffered by client.  Omit if computed by `bufferedSize` below.
          in: query
          schema:
            type: integer
          example: 100
        - name: bufferedSize
          description: Size in kilobytes of data buffered by client.  Omit if computed by `bufferedTime` above
          in: query
          schema:
            type: integer
          example: 1024
        - name: containerKey
          description: Groups timeline reports (e.g. /playQueues/123).
          in: query
          schema:
            type: string
        - name: guid
          description: Global unique identifier for the item.
          in: query
          schema:
            type: string
        - name: playQueueID
          description: Identifies the play queue itself (distinct from playQueueItemID).
          in: query
          schema:
            type: integer
        - name: url
          description: Alternative to key/ratingKey (legacy).
          in: query
          schema:
            type: string
        - name: X-Plex-Session-Identifier
          description:
            Unique per client playback session.  Used if a client can playback multiple items at a time (such as
            a browser with multiple tabs)
          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
  /:/unscrobble:
    put:
      operationId: unscrobble
      summary: Mark an item as unplayed
      tags:
        - Timeline
      description: 'Mark an item as unplayed. The client must provide either the `key` or `uri` query parameter

        This API does respond to the GET verb but applications should use PUT'
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: identifier
          description: The identifier of the media provider containing the media to rate.  Typically `com.plexapp.plugins.library`
          in: query
          required: true
          schema:
            type: string
        - name: key
          description: The key of the item to rate.  This is the `ratingKey` found in metadata items
          in: query
          required: false
          schema:
            type: string
        - name: uri
          description:
            URI of the item to scrobble. Format is `library://<section-uuid>/item/<url-encoded-key>` or `plex://movie/<guid>`
            or `plex://episode/<guid>`.
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'See #/components/responses/200'
        '400':
          description: Bad Request.  Can occur when parameters are of the wrong type, or missing
        '404':
          description:
            Indicates that no library with the provide identifier can be found or no item can be found with the
            rating key
  /:/websocket/notifications:
    get:
      operationId: connectWebSocket
      summary: Connect to WebSocket
      tags:
        - Events
      description: Connect to the web socket to get a stream of events
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: filter
          description:
            'By default, all events except logs are sent. A rich filtering mechanism is provided to allow clients
            to opt into or out of each event type using the `filters` parameter. For example:


            - `filters=-log`: All event types except logs (the default).

            - `filters=foo,bar`: Only the foo and bar event types.

            - `filters=`: All events types.

            - `filters=-foo,bar`: All event types except foo and bar.'
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
