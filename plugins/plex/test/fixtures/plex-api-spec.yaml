        Create a 4-character PIN for device linking via OAuth. The user must visit https://plex.tv/link and enter
        the PIN to authorize the device.
      security:
        - clientIdentifier: []
      servers:
        - url: https://plex.tv/api/v2
      parameters:
        - $ref: '#/components/parameters/accepts'
