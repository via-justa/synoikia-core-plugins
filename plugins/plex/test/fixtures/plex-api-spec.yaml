    put:
      operationId: updateItems
      summary: Set the fields of the filtered items
      tags:
        - Library
      description:
        "This endpoint takes an large possible set of values.  Here are some examples.\n- **Parameters, extra documentation**\n\
        \  - artist.title.value\n      - When used with track, both artist.title.value and album.title.value need to be specified\n\
        \  - title.value usage\n      - Summary\n          - Tracks always rename and never merge\n          - Albums and\
        \ Artists\n              - if single item and item without title does not exist, it is renamed.\n              - if\
        \ single item and item with title does exist they are merged.\n              - if multiple they are always merged.\n\
        \      - Tracks\n          - Works as expected will update the track's title\n          - Single track:    `/library/sections/{id}/all?type=10&id=42&title.value=NewName`\n\
        \          - Multiple tracks: `/library/sections/{id}/all?type=10&id=42,43,44&title.value=NewName`\n          - All\
        \ tracks:      `/library/sections/{id}/all?type=10&title.value=NewName`\n      - Albums\n          - Functionality\
        \ changes depending on the existence of an album with the same title\n          - Album exists\n              - Single\
        \ album: `/library/sections/{id}/all?type=9&id=42&title.value=Album 2`\n                  - Album with id 42 is merged\
        \ into album titled \"Album 2\"\n              - Multiple/All albums: `/library/sections/{id}/all?type=9&title.value=Moo\
        \ Album`\n                  - All albums are merged into the existing album titled \"Moo Album\"\n          - Album\
        \ does not exist\n              - Single album: `/library/sections/{id}/all?type=9&id=42&title.value=NewAlbumTitle`\n\
        \                  - Album with id 42 has title modified to \"NewAlbumTitle\"\n              - Multiple/All albums:\
        \ `/library/sections/{id}/all?type=9&title.value=NewAlbumTitle`\n                  - All albums are merged into a\
        \ new album with title=\"NewAlbumTitle\"\n      - Artists\n          - Functionaly changes depending on the existence\
        \ of an artist with the same title.\n          - Artist exists\n              - Single artist: `/library/sections/{id}/all?type=8&id=42&title.value=Artist\
        \ 2`\n                  - Artist with id 42 is merged into existing artist titled \"Artist 2\"\n              - Multiple/All\
        \ artists: `/library/sections/{id}/all?type=8&title.value=Artist 3`\n                  - All artists are merged into\
        \ the existing artist titled \"Artist 3\"\n          - Artist does not exist\n              - Single artist: `/library/sections/{id}/all?type=8&id=42&title.value=NewArtistTitle`\n\
        \                  - Artist with id 42 has title modified to \"NewArtistTitle\"\n              - Multiple/All artists:\
        \ `/library/sections/{id}/all?type=8&title.value=NewArtistTitle`\n                  - All artists are merged into\
        \ a new artist with title=\"NewArtistTitle\"\n\n- **Notes**\n    - Technically square brackets are not allowed in\
        \ an URI except the Internet Protocol Literal Address\n    - RFC3513: A host identified by an Internet Protocol literal\
        \ address, version 6 [RFC3513] or later, is distinguished by enclosing the IP literal within square brackets (\"[\"\
        \ and \"]\"). This is the only place where square bracket characters are allowed in the URI syntax.\n    - Escaped\
        \ square brackets are allowed, but don't render well"
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: sectionId
          description: The id of the section
          in: path
          required: true
          schema:
            type: string
        - name: type
          description: The media type to filter by
          in: query
          schema:
            type: string
          x-speakeasy-name-override: mediaType
        - name: filters
          description: The filters to apply to determine which items should be modified
          in: query
          schema:
            type: string
        - name: field.value
          description: Set the specified field to a new value
          in: query
          schema:
            type: string
        - name: field.locked
          description: Set the specified field to locked (or unlocked if set to 0)
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: title.value
          description: This field is treated specially by albums or artists and may be used for implicit reparenting.
          in: query
          schema:
            type: string
        - name: artist.title.value
          description: Reparents set of Tracks or Albums - used with album.title.* in the case of tracks
          in: query
          schema:
            type: string
        - name: artist.title.id
          description: Reparents set of Tracks or Albums - used with album.title.* in the case of tracks
          in: query
          schema:
            type: string
        - name: album.title.value
          description: Reparents set of Tracks - Must be used in conjunction with artist.title.value or id
          in: query
          schema:
            type: string
        - name: album.title.id
          description: Reparents set of Tracks - Must be used in conjunction with artist.title.value or id
          in: query
          schema:
            type: string
        - name: tagtype[idx].tag.tag
          description: Creates tag and associates it with each item in the set. - [idx] links this and the next parameters together
          in: query
          schema:
            type: string
        - name: tagtype[idx].tagging.object
          description:
            Here `object` may be text/thumb/art/theme - Optionally used in conjunction with tag.tag, to update association
            info across the set.
          in: query
          schema:
            type: string
        - name: tagtype[].tag.tag-
          description: Remove comma separated tags from the set of items
          in: query
          schema:
            type: string
        - name: tagtype[].tag
          description: Remove associations of this type (e.g. genre) from the set of items
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'See #/components/responses/200'
        '400':
          description: The set of parameters are inconsistent or invalid values
        '404':
          description: A required item could not be found
        '409':
          description: Rename of a collection to a name that's already taken
