        - name: Item
          description:
            'Note: OpenAPI cannot properly render this query parameter example ([See GHI](https://github.com/OAI/OpenAPI-Specification/issues/1706)).  It
            should be rendered as:


            Item[type]=42&Item[title]=Jack-Jack Attack&Item[target]=&Item[targetTagID]=1&Item[locationID]=-1&Item[Location][uri]=library://82503060-0d68-4603-b594-8b071d54819e/item//library/metadata/146&Item[Policy][scope]=all&Item[Policy][value]=&Item[Policy][unwatched]=0'
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              title:
                type: string
              type:
                type: integer
              Location:
                type: object
                properties:
                  uri:
                    type: string
              locationID:
                type: integer
              Policy:
                type: object
                properties:
                  scope:
                    type: string
                    enum:
                      - all
                      - count
                  unwatched:
                    $ref: '#/components/schemas/BoolInt'
                  value:
                    type: integer
              target:
                type: string
              targetTagID:
                type: integer
          example:
            Location:
              uri: EXAMPLE
            locationID: -1
            Policy:
              scope: EXAMPLE
              unwatched: 0
            target: EXAMPLE
            targetTagID: 1
            title: EXAMPLE
            type: 42
      responses:
        '200':
          description: 'See #/components/responses/slash-post-responses-200'
        '400':
          description: 'See #/components/responses/400'
        '404':
          description: Playlist not found (or user may not have permission to access playlist) or generator not found
