        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
      x-speakeasy-retries:
        backoff:
          exponent: 2
          initialInterval: 1000
          maxElapsedTime: 300000
          maxInterval: 30000
        retryConnectionErrors: true
        statusCodes:
          - '429'
        strategy: backoff
