  /library/file:
    post:
      operationId: ingestTransientItem
      summary: Ingest a transient item
      tags:
        - Library
      description:
        "This endpoint takes a file path specified in the `url` parameter, matches it using the scanner's match
        mechanism, downloads rich metadata, and then ingests the item as a transient item (without a library section). In
        the case where the file represents an episode, the entire tree (show, season, and episode) is added as transient items.
        At this time, movies and episodes are the only supported types, which are gleaned automatically from the file path.

        Note that any of the parameters passed to the metadata details endpoint (e.g. `includeExtras=1`) work here."
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: url
          description: The file of the file to ingest.
          in: query
          schema:
            type: string
            format: uri
          example: EXAMPLE
        - name: virtualFilePath
          description: A virtual path to use when the url is opaque.
          in: query
          schema:
            type: string
          example: EXAMPLE
        - name: computeHashes
          description: Whether or not to compute Plex and OpenSubtitle hashes for the file. Defaults to 0.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
          example: 1
        - name: ingestNonMatches
          description: Whether or not non matching media should be stored. Defaults to 0.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
          example: 1
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
  /library/matches:
    get:
      operationId: getLibraryMatches
      summary: Get library matches
      tags:
        - Library
      description:
        'The matches endpoint is used to match content external to the library with content inside the library.
        This is done by passing a series of semantic "hints" about the content (its type, name, or release year). Each type
        (e.g. movie) has a canonical set of minimal required hints.

        This ability to match content is useful in a variety of scenarios. For example, in the DVR, the EPG uses the endpoint
        to match recording rules against airing content. And in the cloud, the UMP uses the endpoint to match up a piece of
        media with rich metadata.

        The endpoint response can including multiple matches, if there is ambiguity, each one containing a `score` from 0
        to 100. For somewhat historical reasons, anything over 85 is considered a positive match (we prefer false negatives
        over false positives in general for matching).

        The `guid` hint is somewhat special, in that it generally represents a unique identity for a piece of media (e.g.
        the IMDB `ttXXX`) identifier, in contrast with other hints which can be much more ambiguous (e.g. a title of `Jane
        Eyre`, which could refer to the 1943 or the 2011 version).

        Episodes require either a season/episode pair, or an air date (or both). Either the path must be sent, or the show
        title'
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - $ref: '#/components/parameters/type'
        - $ref: '#/components/parameters/title'
        - name: includeFullMetadata
          description: Include full metadata in the response
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
            description:
              Whether or not to include full metadata on a positive match. When set, and the best match exceeds a
              score threshold of 85, metadata as rich as possible is sent back.
        - name: includeAncestorMetadata
          description: Include ancestor metadata in the response
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
            description: Whether or not to include metadata for the item's ancestor (e.g. show and season data for an episode).
        - name: includeAlternateMetadataSources
          description: Include alternate metadata sources in the response
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
            description:
              Whether or not to return all sources for each metadata field, which results in a different structure
              being passed back.
        - name: guid
          description: Used for movies, shows, artists, albums, and tracks.  Allowed for various URI schemes, to be defined.
          in: query
          schema:
            type: string
        - name: year
          description: Used for movies shows, and albums.  Optional.
          in: query
          schema:
            type: integer
        - name: path
          description:
            Used for movies, episodes, and tracks.  The full path to the media file, used for "cloud-scanning" an
            item.
          in: query
          schema:
            type: string
        - name: grandparentTitle
          description: Used for episodes and tracks.  The title of the show/artist. Required if `path` isn't passed.
          in: query
          schema:
            type: string
        - name: grandparentYear
          description: Used for episodes.  The year of the show.
          in: query
          schema:
            type: integer
        - name: parentIndex
          description: Used for episodes and tracks.  The season/album number.
          in: query
          schema:
            type: integer
        - name: index
          description: Used for episodes and tracks.  The episode/tracks number in the season/album.
          in: query
          schema:
            type: integer
        - name: originallyAvailableAt
          description: Used for episodes.  In the format `YYYY-MM-DD`.
          in: query
          schema:
            type: string
        - name: parentTitle
          description: Used for albums and tracks. The artist name for albums or the album name for tracks.
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
