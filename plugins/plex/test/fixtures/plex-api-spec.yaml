  /log:
    post:
      operationId: writeLog
      summary: Logging a multi-line message to the Plex Media Server log
      tags:
        - Log
      description:
        This endpoint will write multiple lines to the main Plex Media Server log in a single request. It takes
        a set of query strings as would normally sent to the above PUT endpoint as a linefeed-separated block of POST data.
        The parameters for each query string match as above.
      security:
        - token:
            - admin
      requestBody:
        description: Line separated list of log items
        required: true
        content:
          text/plain:
            example:
              level: EXAMPLE
              message: EXAMPLE
              source: EXAMPLE
            schema:
              $ref: '#/components/schemas/LogMessageRequest'
      responses:
        '200':
          description: 'See #/components/responses/200'
        '400':
          description: 'See #/components/responses/400'
    put:
      operationId: writeMessage
      summary: Logging a single-line message to the Plex Media Server log
      tags:
        - Log
      description:
        'This endpoint will write a single-line log message, including a level and source to the main Plex Media
        Server log.


        Note: This endpoint responds to all HTTP verbs **except POST** but PUT is preferred'
      security:
        - token:
            - admin
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: level
          description:
            "An integer log level to write to the PMS log with.\n  - 0: Error\n  - 1: Warning\n  - 2: Info\n  - 3:\
            \ Debug\n  - 4: Verbose"
          in: query
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
        - name: message
          description: The text of the message to write to the log.
          in: query
          schema:
            type: string
        - name: source
          description: A string indicating the source of the message.
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'See #/components/responses/200'
        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
  /log/networked:
    post:
      operationId: enablePapertrail
      summary: Enabling Papertrail
      tags:
        - Log
      description:
        'This endpoint will enable all Plex Media Server logs to be sent to the Papertrail networked logging site
        for a period of time


        Note: This endpoint responds to all HTTP verbs but POST is preferred'
      security:
        - token:
