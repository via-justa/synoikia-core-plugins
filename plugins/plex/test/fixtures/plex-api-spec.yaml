  /media/subscriptions:
    get:
      operationId: getAllSubscriptions
      summary: Get all subscriptions
      tags:
        - Subscriptions
      description: Get all subscriptions and potentially the grabs too
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: includeGrabs
          description: Indicates whether the active grabs should be included as well
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: includeStorage
          description: Compute the storage of recorded items desired by this subscription
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: X-Plex-Container-Start
          description: Pagination start offset.
          in: query
          schema:
            type: integer
        - name: X-Plex-Container-Size
          description: Pagination page size.
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '403':
          description: User cannot access DVR on this server
    post:
      operationId: createSubscription
      summary: Create a subscription
      tags:
        - Subscriptions
      description: Create a subscription. The query parameters should be mostly derived from the [template](#tag/Subscriptions/operation/mediaSubscriptionsGetTemplate)
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: targetLibrarySectionID
          description:
            The library section into which we'll grab the media.  Not actually required when the subscription is
            to a playlist.
          in: query
          schema:
            type: integer
          example: 1
        - name: targetSectionLocationID
          description: The section location into which to grab.
          in: query
          schema:
            type: integer
          example: 3
        - name: type
          description: The type of the thing we're subscribing too (e.g. show, season).
          in: query
          schema:
            type: integer
          example: 2
          x-speakeasy-name-override: mediaType
        - name: hints
          description:
            "Hints describing what we're looking for.  Note: The hint `ratingKey` is required for downloading from
            a PMS remote."
          in: query
          style: deepObject
          schema:
            type: object
          example:
            title: EXAMPLE
        - name: prefs
          description: Subscription preferences.
          in: query
          style: deepObject
          schema:
            type: object
          example:
            minVideoQuality: 720
        - name: params
          description:
            "Subscription parameters.\n  - `mediaProviderID`: Required for downloads to indicate which MP the subscription\
            \ will download into\n  - `source`: Required for downloads to indicate the source of the downloaded content."
          in: query
          style: deepObject
          schema:
            type: object
          example:
            mediaProviderID: 1
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
