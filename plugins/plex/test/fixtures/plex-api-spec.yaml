        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: uri
          description: The content URI for what we're playing (e.g. `library://...`).
          in: query
          schema:
            type: string
        - name: playQueueID
          description: To create a playlist from an existing play queue.
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
  /playlists/upload:
    post:
      operationId: uploadPlaylist
      summary: Upload media art
      tags:
        - Library Playlists
      description:
        Imports m3u playlists by passing a path on the server to scan for m3u-formatted playlist files, or a path
        to a single playlist file.
      security:
        - token:
            - admin
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: path
          description:
            Absolute path to a directory on the server where m3u files are stored, or the absolute path to a playlist
            file on the server. If the `path` argument is a directory, that path will be scanned for playlist files to be processed.
            Each file in that directory creates a separate playlist, with a name based on the filename of the file that created
            it. The GUID of each playlist is based on the filename. If the `path` argument is a file, that file will be used
            to create a new playlist, with the name based on the filename of the file that created it. The GUID of each playlist
            is based on the filename.
          in: query
          schema:
            type: string
          example: EXAMPLE
        - name: force
          description:
            Force overwriting of duplicate playlists. By default, a playlist file uploaded with the same path will
            overwrite the existing playlist. The `force` argument is used to disable overwriting. If the `force` argument is
            set to 0, a new playlist will be created suffixed with the date and time that the duplicate was uploaded.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
      responses:
        '200':
          description: 'See #/components/responses/200'
        '403':
          description: 'See #/components/responses/200'
        '500':
          description: The playlist could not be imported
  /playQueues:
    post:
      operationId: createPlayQueue
      summary: Create a play queue
      tags:
        - Play Queue
      description:
        'Makes a new play queue for a device. The source of the playqueue can either be a URI, or a playlist. The
        response is a media container with the initial items in the queue. Each item in the queue will be a regular item but
        with `playQueueItemID` - a unique ID since the queue could have repeated items with the same `ratingKey`.

        Note: Either `uri` or `playlistID` must be specified'
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: uri
          description: The content URI for what we're playing.
          in: query
          schema:
            type: string
        - name: playlistID
          description: the ID of the playlist we're playing.
          in: query
          schema:
            type: integer
        - name: type
          description: The type of play queue to create
          in: query
          required: true
          schema:
            type: string
            enum:
              - audio
              - video
              - photo
          x-speakeasy-name-override: mediaType
        - name: key
          description: The key of the first item to play, defaults to the first in the play queue.
          in: query
          schema:
            type: string
        - name: shuffle
          description: Whether to shuffle the playlist, defaults to 0.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: repeat
          description: If the PQ is bigger than the window, fill any empty space with wraparound items, defaults to 0.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: continuous
          description: Whether to create a continuous play queue (e.g. from an episode), defaults to 0.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: extrasPrefixCount
          description:
            Number of trailers to prepend a movie with not including the pre-roll. If omitted the pre-roll will not
            be returned in the play queue. When resuming a movie `extrasPrefixCount` should be omitted as a parameter instead
            of passing 0.
          in: query
          schema:
            type: integer
        - name: recursive
          description:
            Only applies to queues of type photo, whether to retrieve all descendent photos from an album or section,
            defaults to 1.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: onDeck
          description:
            Only applies to queues of type show or seasons, whether to return a queue that is started on the On Deck
            episode if one exists. Otherwise begins the play queue on the beginning of the show or season.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
