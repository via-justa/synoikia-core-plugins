    post:
      operationId: createTransientToken
      summary: Get Transient Tokens
      tags:
        - General
      description:
        "This endpoint provides the caller with a temporary token with the same access level as the caller's token.
        These tokens are valid for up to 48 hours and are destroyed if the server instance is restarted.

        Note: This endpoint responds to all HTTP verbs but POST in preferred"
      parameters:
