        '400':
          description: 'See #/components/responses/400'
        '404':
          description: Playlist not found (or user may not have permission to access playlist)
    get:
      operationId: getPlaylistItems
      summary: Retrieve Playlist Contents
      tags:
        - Playlist
      description:
        Gets the contents of a playlist. Should be paged by clients via standard mechanisms. By default leaves
        are returned (e.g. episodes, movies). In order to return other types you can use the `type` parameter. For example,
        you could use this to display a list of recently added albums vis a smart playlist. Note that for dumb playlists,
        items have a `playlistItemID` attribute which is used for deleting or moving items.
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: playlistId
          description: The ID of the playlist
          in: path
          required: true
          schema:
            type: integer
        - name: type
          description:
            The metadata types of the item to return.  Values past the first are only used in fetching items from
            the background processing playlist.
          in: query
          explode: false
          schema:
            type: array
            items:
              type: integer
          x-speakeasy-name-override: mediaType
      responses:
        '200':
          description: OK
        '404':
          description: Playlist not found (or user may not have permission to access playlist)
    put:
      operationId: addPlaylistItems
      summary: Adding to  a Playlist
      tags:
        - Library Playlists
      description:
        Adds a generator to a playlist, same parameters as the POST above. With a dumb playlist, this adds the
        specified items to the playlist. With a smart playlist, passing a new `uri` parameter replaces the rules for the playlist.
        Returns the playlist.
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: playlistId
          description: The ID of the playlist
          in: path
          required: true
          schema:
            type: integer
        - name: uri
          description: The content URI for the playlist.
          in: query
          schema:
            type: string
        - name: playQueueID
          description: The play queue to add to a playlist.
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 'See #/components/responses/slash-post-responses-200'
        '400':
          description: 'See #/components/responses/400'
        '404':
          description: Playlist not found (or user may not have permission to access playlist)
  /playQueues/{playQueueId}:
    get:
      operationId: getPlayQueue
      summary: Retrieve a play queue
      tags:
        - Play Queue
      description:
        Retrieves the play queue, centered at current item. This can be treated as a regular container by play
        queue-oblivious clients, but they may wish to request a large window onto the queue since they won't know to refresh.
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: playQueueId
          description: The ID of the play queue.
          in: path
          required: true
          schema:
            type: integer
        - name: own
          description: If the server should transfer ownership to the requesting client (used in remote control scenarios).
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: center
          description: The play queue item ID for the center of the window - this doesn't change the current selected item.
          in: query
          schema:
            type: string
        - name: window
          description: How many items on each side of the center of the window
          in: query
          schema:
            type: integer
        - name: includeBefore
          description: Whether to include the items before the center (if 0, center is not included either), defaults to 1.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: includeAfter
          description: Whether to include the items after the center (if 0, center is not included either), defaults to 1.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
      responses:
        '200':
          description: The play queue
        '400':
          description: 'See #/components/responses/400'
        '404':
          description: Play queue not found
    put:
      operationId: addToPlayQueue
      summary: Add a generator or playlist to a play queue
      tags:
        - Play Queue
      description:
        Adds an item to a play queue (e.g. party mode). Increments the version of the play queue. Takes the following
        parameters (`uri` and `playlistID` are mutually exclusive). Returns the modified play queue.
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: playQueueId
          description: The ID of the play queue.
          in: path
          required: true
          schema:
            type: integer
        - name: uri
          description: The content URI for what we're adding to the queue.
          in: query
          schema:
            type: string
        - name: playlistID
          description: The ID of the playlist to add to the playQueue.
          in: query
          schema:
            type: string
        - name: next
          description: Play this item next (defaults to 0 - queueing at the end of manually queued items).
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
      responses:
        '200':
          description: 'See #/components/responses/slash-post-responses-200'
