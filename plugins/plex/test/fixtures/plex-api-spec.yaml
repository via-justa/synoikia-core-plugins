  /status/sessions/history/all:
    get:
      operationId: listPlaybackHistory
      summary: List Playback History
      tags:
        - Status
      description: 'List all playback history (Admin can see all users, others can only see their own).

        Pagination should be used on this endpoint.  Additionally this endpoint supports `includeFields`, `excludeFields`,
        `includeElements`, and `excludeElements` parameters.'
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: X-Plex-Container-Start
          description: Pagination start offset
          in: query
          schema:
            type: integer
        - name: X-Plex-Container-Size
          description: Pagination page size
          in: query
          schema:
            type: integer
        - name: accountID
          description: The account id to restrict view history
          in: query
          schema:
            type: integer
        - name: viewedAt
          description: The time period to restrict history (typically of the form `viewedAt>=12456789`)
          in: query
          schema:
            type: integer
        - name: librarySectionID
          description: The library section id to restrict view history
          in: query
          schema:
            type: integer
        - name: metadataItemID
          description:
            The metadata item to restrict view history (can provide the id for a show to see all of that show's view
            history).  Note this is translated to `metadata_items.id`, `parents.id`, or `grandparents.id` internally depending
            on the metadata type.
          in: query
          schema:
            type: integer
        - name: sort
          description:
            The field on which to sort.  Multiple orderings can be specified separated by `,` and the direction specified
            following a `:` (`desc` or `asc`; `asc` is assumed if not provided).  Note `metadataItemID` may not be used here.
          in: query
          schema:
            type: array
            items:
              type: string
          example:
            - EXAMPLE
            - EXAMPLE
        - name: excludeElements
          description: Comma-separated list of elements to exclude from the response
          in: query
          schema:
            type: string
        - name: excludeFields
          description: Comma-separated list of fields to exclude from the response
          in: query
          schema:
            type: string
        - name: includeFields
          description: Whitelist of fields to return
          in: query
          schema:
            type: string
        - name: includeElements
          description: Whitelist of elements to include
          in: query
          schema:
            type: string
        - name: viewedAt>
          description: Greater-than filter for viewedAt timestamp
          in: query
          schema:
            type: integer
        - name: viewedAt<
          description: Less-than filter for viewedAt timestamp
          in: query
          schema:
            type: integer
        - name: deviceID
          description: Filter by device ID
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '400':
          description: 'See #/components/responses/400'
        '401':
          description: 'See #/components/responses/401'
