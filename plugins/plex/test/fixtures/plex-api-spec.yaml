  /photo/:/transcode:
    get:
      operationId: transcodeImage
      summary: Transcode an image
      tags:
        - Transcoder
      description: Transcode an image, possibly changing format or size
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: url
          description:
            The source URL for the image to transcode.  Note, if this URL requires a token such as `X-Plex-Token`,
            it should be given as a query parameter to this url.
          in: query
          schema:
            type: string
          example: EXAMPLE
        - name: format
          description: The output format for the image; defaults to jpg
          in: query
          required: false
          schema:
            type: string
            enum:
              - jpg
              - jpeg
              - png
              - ppm
        - name: width
          description: The desired width of the output image
          in: query
          schema:
            type: integer
        - name: height
          description: The desired height of the output image
          in: query
          schema:
            type: integer
        - name: quality
          description: The desired quality of the output.  -1 means the highest quality.  Defaults to -1
          in: query
          required: false
          schema:
            type: integer
            minimum: -1
            maximum: 127
        - name: background
          description:
            The background color to apply before painting the image.  Only really applicable if image has transparency.  Defaults
            to none
          in: query
          required: false
          schema:
            type: string
          example: EXAMPLE
        - name: upscale
          description: Indicates if image should be upscaled to the desired width/height.  Defaults to false
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: minSize
          description:
            Indicates if image should be scaled to fit the smaller dimension.  By default (false) the image is scaled
            to fit within the width/height specified but if this parameter is true, it will allow overflowing one dimension
            to fit the other.  Essentially it is making the width/height minimum sizes of the image or sizing the image to fill
            the entire width/height even if it overflows one dimension.
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: rotate
          description: Obey the rotation values specified in EXIF data.  Defaults to true.
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: blur
          description: Apply a blur to the image, Defaults to 0 (none)
          in: query
          required: false
          schema:
            type: integer
        - name: saturation
          description: Scale the image saturation by the specified percentage.  Defaults to 100
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: opacity
          description: Render the image at the specified opacity percentage.  Defaults to 100
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: chromaSubsampling
          description:
            "Use the specified chroma subsambling.\n  - 0: 411\n  - 1: 420\n  - 2: 422\n  - 3: 444\nDefaults to 3\
            \ (444)"
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
        - name: blendColor
          description: The color to blend with the image.  Defaults to none
          in: query
          required: false
          schema:
            type: string
          example: EXAMPLE
      responses:
        '200':
          description: The resulting image
        '400':
          description: 'See #/components/responses/400'
        '403':
          description: 'See #/components/responses/403'
        '404':
          description: 'See #/components/responses/404'
