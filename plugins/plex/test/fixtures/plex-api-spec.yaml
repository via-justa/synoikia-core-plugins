    MediaQuery:
      description:
        'A querystring-based filtering language used to select subsets of media. When provided as an object, properties
        are serialized as a querystring using form style with explode.


        Only the defined properties below are allowed. The object serializes to a querystring format like: `type=4&sourceType=2&sort=duration:desc,index`'
      type: object
      example:
        type: 4
        sourceType: 2
        sort: EXAMPLE
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/MediaType'
          description: The type of media to retrieve or filter by.
        group:
          description: Field to group results by (similar to SQL GROUP BY)
          type: string
        limit:
          description: Maximum number of results to return
          type: integer
        sort:
          description:
            Field(s) to sort by, with optional modifiers. Use comma to separate multiple fields, and :desc or :nullsLast
            for modifiers (e.g., "duration:desc,index")
          type: string
        sourceType:
          description: Change the default level to which fields refer (used with type for hierarchical queries)
          type: integer
    TokenExchangeRequest:
