      summary: Applying updates
      tags:
        - Updater
      description:
        Apply any downloaded updates.  Note that the two parameters `tonight` and `skip` are effectively mutually
        exclusive. The `tonight` parameter takes precedence and `skip` will be ignored if `tonight` is also passed.
      security:
        - token:
            - admin
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
