    get:
      operationId: getMetadataItem
      summary: Get a metadata item
      tags:
        - Content
      description: Get one or more metadata items.
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: ids
          description: Comma-separated list of IDs
          in: path
          required: true
          schema:
            type: array
            items:
              type: string
        - name: asyncCheckFiles
          description:
            Determines if file check should be performed asynchronously.  An activity is created to indicate progress.  Default
            is false.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: asyncRefreshLocalMediaAgent
          description:
            Determines if local media agent refresh should be performed asynchronously.  An activity is created to
            indicate progress.  Default is false.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: asyncRefreshAnalysis
          description:
            Determines if analysis refresh should be performed asynchronously.  An activity is created to indicate
            progress.  Default is false.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: checkFiles
          description:
            Determines if file check should be performed synchronously.  Specifying `asyncCheckFiles` will cause
            this option to be ignored.  Default is false.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: skipRefresh
          description:
            Determines if synchronous local media agent and analysis refresh should be skipped.  Specifying async
            versions will cause synchronous versions to be skipped.  Default is false.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: checkFileAvailability
          description:
            Determines if file existence check should be performed synchronously.  Specifying `checkFiles` will imply
            this option.  Default is false.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: asyncAugmentMetadata
          description:
            Add metadata augmentations.  An activity is created to indicate progress.  Option will be ignored if
            specified by non-admin or if multiple metadata items are requested.  Default is false.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: augmentCount
          description: Number of augmentations to add.  Requires `asyncAugmentMetadata` to be specified.
          in: query
          schema:
            $ref: '#/components/schemas/BoolInt'
        - name: includeMarkers
          description: Include intro/credits markers in the response
          in: query
          schema:
            type: boolean
        - name: includeGuids
          description: Include external GUIDs (e.g. TMDB, TVDB) in the response
          in: query
          schema:
            type: boolean
        - name: includeChapters
          description: Include chapter data in the response
          in: query
          schema:
            type: boolean
        - name: includeExternalMedia
          description: Include external/online media in the response
          in: query
          schema:
            type: boolean
        - name: includeExtras
          description: Include trailers, behind-the-scenes, and other extras
          in: query
          schema:
            type: boolean
        - name: includeRelated
          description: Include related items in the response
          in: query
          schema:
            type: boolean
        - name: includeOnDeck
          description: Include On Deck status in the response
          in: query
          schema:
            type: boolean
        - name: includePopularLeaves
          description: Include popular episodes in the response
          in: query
          schema:
            type: boolean
        - name: includeReviews
          description: Include user reviews in the response
          in: query
          schema:
            type: boolean
        - name: includeStations
          description: Include radio station data in the response
          in: query
          schema:
            type: boolean
        - name: excludeElements
          description: Comma-separated list of elements to exclude from the response
          in: query
          schema:
            type: string
        - name: excludeFields
