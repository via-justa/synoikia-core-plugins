  /hubs/search:
    get:
      operationId: searchHubs
      summary: Search Hub
      tags:
        - Search
      description:
        "Perform a search and get the result as hubs\n\nThis endpoint performs a search across all library sections,\
        \ or a single section, and returns matches as hubs, split up by type. It performs spell checking, looks for partial\
        \ matches, and orders the hubs based on quality of results. In addition, based on matches, it will return other related\
        \ matches (e.g. for a genre match, it may return movies in that genre, or for an actor match, movies with that actor).\n\
        \nIn the response's items, the following extra attributes are returned to further describe or disambiguate the result:\n\
        \n- `reason`: The reason for the result, if not because of a direct search term match; can be either:\n  - `section`:\
        \ There are multiple identical results from different sections.\n  - `originalTitle`: There was a search term match\
        \ from the original title field (sometimes those can be very different or in a foreign language).\n  - `<hub identifier>`:\
        \ If the reason for the result is due to a result in another hub, the source hub identifier is returned. For example,\
        \ if the search is for \"dylan\" then Bob Dylan may be returned as an artist result, an a few of his albums returned\
        \ as album results with a reason code of `artist` (the identifier of that particular hub). Or if the search is for\
        \ \"arnold\", there might be movie results returned with a reason of `actor`\n- `reasonTitle`: The string associated\
        \ with the reason code. For a section reason, it'll be the section name; For a hub identifier, it'll be a string associated\
        \ with the match (e.g. `Arnold Schwarzenegger` for movies which were returned because the search was for \"arnold\"\
        ).\n- `reasonID`: The ID of the item associated with the reason for the result. This might be a section ID, a tag\
        \ ID, an artist ID, or a show ID.\n\nThis request is intended to be very fast, and called as the user types."
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - name: query
          description: The query term
          in: query
          required: true
          schema:
            type: string
        - name: sectionId
          description: This gives context to the search, and can result in re-ordering of search result hubs.
          in: query
          schema:
            type: integer
          example: 1
        - name: limit
          description: The number of items to return per hub.  3 if not specified
          in: query
          schema:
            type: integer
        - name: includeCollections
          description: Include collection results in search hubs
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
        '400':
          description: A required parameter was not given, the wrong type, or wrong value
        '404':
          description: Search restrictions result in no possible items found (such as searching no sections)
  /hubs/search/voice:
    get:
      operationId: voiceSearchHubs
      summary: Voice Search Hub
      tags:
        - Search
      description: 'Perform a search tailored to voice input and get the result as hubs


        This endpoint performs a search specifically tailored towards voice or other imprecise input which may work badly
        with the substring and spell-checking heuristics used by the `/hubs/search` endpoint. It uses a [Levenshtein distance](https://en.wikipedia.org/wiki/Levenshtein_distance)
        heuristic to search titles, and as such is much slower than the other search endpoint. Whenever possible, clients
        should limit the search to the appropriate type.


        Results, as well as their containing per-type hubs, contain a `distance` attribute which can be used to judge result
        quality.'
      parameters:
        - $ref: '#/components/parameters/accepts'
        - $ref: '#/components/parameters/X-Plex-Client-Identifier'
        - $ref: '#/components/parameters/X-Plex-Product'
        - $ref: '#/components/parameters/X-Plex-Version'
        - $ref: '#/components/parameters/X-Plex-Platform'
        - $ref: '#/components/parameters/X-Plex-Platform-Version'
        - $ref: '#/components/parameters/X-Plex-Device'
        - $ref: '#/components/parameters/X-Plex-Model'
        - $ref: '#/components/parameters/X-Plex-Device-Vendor'
        - $ref: '#/components/parameters/X-Plex-Device-Name'
        - $ref: '#/components/parameters/X-Plex-Marketplace'
        - $ref: '#/components/parameters/type'
        - name: query
          description: The query term
          in: query
          required: true
          schema:
            type: string
        - name: limit
          description: The number of items to return per hub.  3 if not specified
          in: query
          schema:
            type: integer
        - name: includeCollections
          description: Include collection results in search hubs
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
        '400':
          description: A required parameter was not given, the wrong type, or wrong value
