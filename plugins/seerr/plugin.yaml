# yaml-language-server: $schema=./node_modules/@synoikia/plugin-sdk/plugin-settings.schema.json
# Rules on top of Seerr's OpenAPI catalog (SR §2.2–§3.4): GET reads, other verbs write, action-like GETs
# are writes until a rule settles them.

defaults:
  # Locked operations without their own literal confirm against the instance's title.
  confirm: instance
  timeouts: { request: 15000, lookup: 10000 }

instanceName: { op: 'GET /settings/public', field: applicationTitle, fallback: Seerr }

rules:
  # Irreversible or affecting other users or integrations: always a human with a typed confirmation.
  - match:
      - 'DELETE /user/{userId}'
      - 'PUT /user'
      - 'DELETE /settings/radarr/{radarrId}'
      - 'DELETE /settings/sonarr/{sonarrId}'
      - 'POST /settings/initialize'
      - 'POST /settings/main/regenerate'
      - 'DELETE /settings/discover/{sliderId}'
      - 'GET /settings/discover/reset'
      # Seerr 3.0–3.4.1 re-saves the enabled-library list on every call: without `enable`, every library is
      # disabled. From 3.5.0 these are plain reads; locking them there only over-locks (fail closed).
      - 'GET /settings/plex/library'
      - 'GET /settings/jellyfin/library'
    locked: true

  - match: ['GET /settings/plex/library', 'GET /settings/jellyfin/library']
    description: >-
      Seerr 3.0–3.4.1 saves the enabled-library list on every call: libraries not listed in `enable` are
      disabled. Locked.
    summaryNote: '(saves the enabled-library list: libraries not listed in `enable` are disabled)'

  # GETs the heuristic flags that were reviewed and only read. A newly flagged GET that is neither
  # locked nor listed here stays a write until someone reviews it.
  - match: 'GET /settings/jellyfin/sync' # "Get status of full Jellyfin library sync"
    classification: read
    reason: verb:GET
    needsReview: false

  # Locked twins picked per call: `#on-behalf` decides another user's request (SR §3.4); `#start` starts a
  # full library scan or any job not in `plugin.cheapJobs` (SR §2.3).
  - match: 'POST /request/{requestId}/{status}'
    split: on-behalf
  - match: ['POST /settings/plex/sync', 'POST /settings/jellyfin/sync', 'POST /settings/jobs/{jobId}/run']
    split: start

  - match: 'POST /settings/jobs/{jobId}/run#start'
    description: >-
      Running a full library scan or another heavy or unknown scheduled job: locked. Cheap jobs (recently added
      scans, Radarr/Sonarr scans, download sync, …) use the ordinary key.
    confirm: { param: /path/jobId }
  - match: '*#on-behalf'
    description: 'Approving or declining a request filed by another Seerr user: locked.'
    summaryNote: "(another user's request)"
    confirm:
      lookup:
        op: 'GET /request/{requestId}'
        args: [{ requestId: { $param: /path/requestId } }]
        field: [/requestedBy/displayName, /requestedBy/email]
  - match: '*#start'
    description: 'Starting a full library scan: locked.'
    summaryNote: '(starts a full library scan or another heavy job)'

  # The literal an approver types: the thing the operation affects (SR §3.4).
  - match: 'DELETE /user/{userId}'
    confirm:
      lookup: { op: 'GET /user/{userId}', args: [{ userId: { $param: /path/userId } }], field: [email, displayName] }
  - match: 'DELETE /settings/radarr/{radarrId}'
    confirm:
      lookup:
        op: 'GET /settings/radarr'
        find: { field: id, equals: { $param: /path/radarrId } }
        field: [name, title]
  - match: 'DELETE /settings/sonarr/{sonarrId}'
    confirm:
      lookup:
        op: 'GET /settings/sonarr'
        find: { field: id, equals: { $param: /path/sonarrId } }
        field: [name, title]
  - match: 'DELETE /settings/discover/{sliderId}'
    confirm:
      lookup:
        op: 'GET /settings/discover'
        find: { field: id, equals: { $param: /path/sliderId } }
        field: [name, title]

  - match: 'POST /request'
    matchProfile: media-request

plugin:
  # The spec, from the tag matching `/status`'s version, else `develop` (SR §2.2); the base URL is a
  # connection field, so a mirror works offline.
  spec:
    baseUrl: https://raw.githubusercontent.com/seerr-team/seerr
    file: seerr-api.yml
    fallbackRef: develop
    maxBytes: 5242880
    timeoutMs: 20000
  # Words that make a GET a write flagged for review (SR §2.3); the SDK's path check is off, every GET
  # having been reviewed against this list (test/catalog.test.ts).
  actionWords: ['reset\w*', 'regenerat\w*', 'sync\w*', 'flush\w*', run, runs, 'cancel\w*', 'invok\w*']
  # Guard against an empty or truncated spec replacing a real catalog (SR §5).
  minOperations: 50
  # Scheduled jobs cheap to run on demand; any other job, a future one included, takes the locked `#start`.
  cheapJobs:
    - plex-recently-added-scan
    - jellyfin-recently-added-scan
    - plex-refresh-token
    - plex-watchlist-sync
    - radarr-scan
    - sonarr-scan
    - download-sync
    - image-cache-cleanup
