plugin:
  # Device classes that make a cover a garage door or gate, and domains that are always protected.
  garageClasses: [garage, gate]
  protectedDomains: [lock, alarm_control_panel]
  # Registry events that invalidate the cached registry view, and events that change the catalog.
  registryEvents:
    - area_registry_updated
    - device_registry_updated
    - entity_registry_updated
    - floor_registry_updated
    - label_registry_updated
  catalogEvents: [component_loaded, service_registered, service_removed]
  registryTtlMs: 300000
  # Registries managed over WebSocket (`config/<name>_registry/<verb>`) and the field that names an entry.
  registryIds:
    { area: area_id, floor: floor_id, label: label_id, category: category_id, device: device_id, entity: entity_id }
