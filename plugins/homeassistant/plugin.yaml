# yaml-language-server: $schema=./node_modules/@synoikia/plugin-sdk/plugin-settings.schema.json
# Every `domain.service` plus the fixed commands below, no raw passthrough (HA §2.2–§3.4); every service
# is a write, whatever its name, and these rules lock and split on top.

defaults:
  # A locked service confirms against the entities it acts on; anything else against the instance's name.
  confirm: [targets, instance]
  timeouts: { request: 15000, lookup: 10000 }

instanceName: { op: get_config, field: location_name, fallback: Home Assistant }

rules:
  # Physical-safety or system-integrity critical: always a human with a typed confirmation (HA §3.4).
  - match:
      - lock.unlock
      - lock.open
      - alarm_control_panel.alarm_disarm
      - homeassistant.restart
      - homeassistant.stop
      - hassio.host_reboot
      - hassio.host_shutdown
      - hassio.restore_full
      - hassio.restore_partial
      - backup.restore
    locked: true
    reason: locked:physical-or-system

  # Locked twins taken when any resolved target is sensitive, by device class and domain (design §3.4):
  # `#garage` opens a garage cover; `#protected` touches a lock, alarm or garage door (unknown counts).
  - match: [cover.open_cover, cover.toggle, cover.set_cover_position]
    split: garage
  - match: [homeassistant.turn_on, homeassistant.turn_off, homeassistant.toggle, scene.apply, scene.turn_on]
    split: protected
  - match: '*#garage'
    reason: locked:physical-or-system
    description: '{base} on a garage door or gate: locked.'
    summaryNote: (a garage door or gate)
  - match: 'scene.apply#protected'
    confirm: { custom: protected-scene-entities }
  - match: '*#protected'
    reason: locked:physical-or-system
    description: '{base} on a lock, an alarm panel, or a garage door or gate: locked.'
    summaryNote: (a lock, alarm panel, garage door or gate)

  # Deleting a config object or a registry entry.
  - match:
      - config/automation/config/delete
      - config/script/config/delete
      - config/scene/config/delete
      - config/area_registry/delete
      - config/floor_registry/delete
      - config/label_registry/delete
      - config/category_registry/delete
      - config/entity_registry/remove
    locked: true
    reason: locked:config-delete
  - match: 'config/*/config/delete'
    confirm: [{ custom: config-alias }, instance]
  - match: 'config/*_registry/*'
    confirm: [{ custom: registry-name }, instance]

  - match: climate.set_temperature
    matchProfile: climate.set_temperature

operations:
  - key: get_states
    kind: ws_command
    group: states
    classification: read
    summary: 'Current states. Filter with entity_id, domain or area rather than reading everything.'
    paramsSchema:
      {
        type: 'object',
        properties:
          {
            entity_id:
              {
                anyOf: [{ type: 'string' }, { type: 'array', items: { type: 'string' } }],
                description: 'Entity id(s)',
              },
            domain:
              {
                anyOf: [{ type: 'string' }, { type: 'array', items: { type: 'string' } }],
                description: 'Domain(s), e.g. light',
              },
            area:
              { anyOf: [{ type: 'string' }, { type: 'array', items: { type: 'string' } }], description: 'Area id(s)' },
          },
      }
  - key: get_config
    kind: ws_command
    group: system
    classification: read
    summary: 'Core configuration: version, location, units.'
  - key: history/history_during_period
    kind: ws_command
    group: history
    classification: read
    summary: State history of some entities over a period.
    paramsSchema:
      {
        type: 'object',
        properties:
          {
            start_time: { type: 'string', description: 'ISO 8601' },
            end_time: { type: 'string', description: 'ISO 8601' },
            entity_ids: { type: 'array', items: { type: 'string' } },
            minimal_response: { type: 'boolean' },
            no_attributes: { type: 'boolean' },
            significant_changes_only: { type: 'boolean' },
          },
        required: ['start_time', 'entity_ids'],
      }
  - key: logbook/get_events
    kind: ws_command
    group: logbook
    classification: read
    summary: Logbook events over a period.
    paramsSchema:
      {
        type: 'object',
        properties:
          {
            start_time: { type: 'string', description: 'ISO 8601' },
            end_time: { type: 'string', description: 'ISO 8601' },
            entity_ids: { type: 'array', items: { type: 'string' } },
          },
        required: ['start_time'],
      }
  - key: lovelace/dashboards/list
    kind: ws_command
    group: dashboard
    classification: read
    summary: Dashboards.
  - key: lovelace/config
    kind: ws_command
    group: dashboard
    classification: read
    summary: A dashboard config and its config_hash (for lovelace/config/save).
    paramsSchema:
      {
        type: 'object',
        properties: { url_path: { type: 'string', description: 'Dashboard url_path; omit for the default dashboard' } },
      }
  - key: lovelace/config/save
    kind: config
    group: dashboard
    classification: write
    summary: Edit a dashboard with a JSON Patch against the config_hash read by lovelace/config.
    paramsSchema:
      {
        type: 'object',
        properties:
          {
            url_path: { type: 'string', description: 'Dashboard url_path' },
            config_hash: { type: 'string', description: 'From lovelace/config' },
            patch:
              {
                type: 'array',
                description: 'RFC 6902 JSON Patch against the object read with …/get: ops add, remove, replace, test; "-" appends to an array.',
                items:
                  {
                    type: 'object',
                    properties:
                      {
                        op: { enum: ['add', 'remove', 'replace', 'test'] },
                        path: { type: 'string', description: 'JSON pointer, e.g. /triggers/-' },
                        value: {},
                      },
                    required: ['op', 'path'],
                  },
              },
          },
        required: ['config_hash', 'patch'],
      }
  - key: config/automation/config/get
    kind: ws_command
    group: automation
    classification: read
    summary: "A automation's config and its config_hash (for config/automation/config/update)."
    paramsSchema:
      {
        type: 'object',
        properties: { id: { type: 'string', description: 'automation config id (the "id" field)' } },
        required: ['id'],
      }
  - key: config/automation/config/create
    kind: ws_command
    group: automation
    classification: write
    summary: Create a automation from a full config. Read its guide with guides.get first.
    attestation: true
    paramsSchema:
      {
        type: 'object',
        properties:
          {
            id: { type: 'string', description: 'automation config id (the "id" field); generated when omitted' },
            config: { type: 'object' },
          },
        required: ['config'],
      }
  - key: config/automation/config/update
    kind: config
    group: automation
    classification: write
    summary: Edit a automation with a JSON Patch against the config_hash read by config/automation/config/get.
